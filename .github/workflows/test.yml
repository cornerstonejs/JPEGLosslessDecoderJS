name: testing
on: push

jobs:
  test:
    strategy:
      matrix:
        # vitest 4 needs node ^20 || ^22 || >=24, so 18.x and 16.x cannot run
        # the tests any more. Both reached end of life (node 16 in 2023-09,
        # node 18 in 2025-04). 24.x is what release.yml publishes on.
        node-version: [20.x, 22.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      # npm 11 on every leg. package-lock.json is written by npm 11, and npm 10
      # cannot read it: `npm ci` stops with EBADPLATFORM on esbuild's optional
      # per-platform packages ("Unsupported platform for
      # @esbuild/aix-ppc64: wanted os aix, current linux"). Node 20 ships npm
      # 10.8 and node 22 ships npm 10.9, so both need this; node 24 already
      # bundles npm 11.19. release.yml pins node 24.20.0 for the same reason.
      - run: npm install --global npm@^11
      # `npm ci` rather than `npm install`: the lockfile is the tested input,
      # and release.yml installs the same way.
      - run: npm ci
      - run: npm run build
      - name: Lint
        run: npm run lint
      - run: npm run test