name: testing
on: push

jobs:
  test:
    strategy:
      matrix:
        # vitest 4 needs node ^20 || ^22 || >=24, so 18.x and 16.x cannot run
        # the tests any more. Both reached end of life (node 16 in 2023-09,
        # node 18 in 2025-04). 24.x is what release.yml publishes on.
        node-version: [20.x, 22.x, 24.x]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      # npm 11 on every leg. npm 10 and npm 11 do not resolve the nested
      # `overrides.tsup.esbuild` in package.json the same way: npm 11 settles
      # the whole tree on esbuild 0.19.7, while npm 10 keeps vite's own
      # esbuild 0.28.2 and then reports the lockfile as out of sync
      # ("Missing: esbuild@0.28.2 from lock file"). One lockfile cannot serve
      # both, so this repository needs npm 11 everywhere. Node 20 ships npm
      # 10.8 and node 22 ships npm 10.9; node 24 already bundles npm 11.19,
      # which is why release.yml pins node 24.20.0.
      - run: npm install --global npm@^11
      # `npm ci` rather than `npm install`: the lockfile is the tested input,
      # and release.yml installs the same way.
      - run: npm ci
      - run: npm run build
      - name: Lint
        run: npm run lint
      - run: npm run test